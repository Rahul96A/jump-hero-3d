name: jump_hero_3d
description: Production-ready 3D Mario-inspired platformer - Jump Hero 3D. Original assets, 60FPS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  flutter_joystick: ^0.2.2
  vector_math: ^2.1.4
  flutter_riverpod: ^2.5.1
  audioplayers: ^6.1.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/levels/level_1.json